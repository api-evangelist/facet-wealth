aid: facet-wealth
name: Facet Wealth
description: 'Facet (also known as Facet Wealth) is a national SEC-registered investment
  advisor and financial planning firm founded in 2016 and headquartered in Baltimore,
  Maryland. Facet delivers fiduciary, product-agnostic financial advice through a flat
  annual membership rather than an assets-under-management fee, pairing a proprietary
  technology platform with CERTIFIED FINANCIAL PLANNER professionals. Membership covers
  comprehensive financial planning, investment management, retirement planning, tax
  strategy and filing, equity compensation planning, insurance guidance, education
  planning, and estate planning delivered in partnership with Wealth.com. Facet is a
  direct-to-consumer advisory service: it publishes no public developer program, API
  documentation, or machine-readable contract.'
